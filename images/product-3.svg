<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" role="img" aria-labelledby="product-3-title">
  <title id="product-3-title">Коробка с учебным товаром 3</title>

  <!-- Фон -->
  <rect width="480" height="360" fill="#eefaf0"/>

  <!-- Тень под коробкой -->
  <ellipse cx="240" cy="292" rx="130" ry="14" fill="#d3ecd8"/>

  <!-- Коробка: верхняя, левая и правая грани -->
  <polygon points="240,90 350,140 240,190 130,140" fill="#4fae63"/>
  <polygon points="130,140 240,190 240,290 130,240" fill="#168a2f"/>
  <polygon points="350,140 240,190 240,290 350,240" fill="#0f6321"/>

  <!-- Лента на верхней грани -->
  <polygon points="174,110 196,120 306,170 284,160" fill="#ffffff" fill-opacity="0.85"/>

  <!-- Наклейка на левой грани -->
  <polygon points="150,170 200,193 200,223 150,200" fill="#ffffff" fill-opacity="0.9"/>
</svg>
